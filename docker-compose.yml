services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farm-safety-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEVICE_API_KEY=dev-key
      - CONFIRM_THRESHOLD=0.6
      - DB_PATH=/app/data/events.db
      # - FARMER_PHONE=+91XXXXXXXXXX
      # - TWILIO_SID=
      # - TWILIO_TOKEN=
      # - TWILIO_FROM=
    volumes:
      - farm-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farm-safety-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  farm-data:
